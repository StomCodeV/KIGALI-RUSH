
<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06090f;font:14px system-ui,'Segoe UI',sans-serif;color:#fff;user-select:none}
canvas{display:block}
.p{background:rgba(10,16,28,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 20px;box-shadow:0 10px 40px #0008}

#bar{width:240px;height:4px;background:#1b2a3a;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#19b5ff,#ff7a1a);animation:ld 1.6s forwards}@keyframes ld{to{width:100%}}
.lg{max-width:min(420px,70vw);max-height:150px}.tx{font-weight:800;letter-spacing:.18em;font-size:34px;text-shadow:0 2px 20px #000}.tx b{color:#ff7a1a}.tg{letter-spacing:.3em;font-size:12px;opacity:.8;text-transform:uppercase}
#menu{position:fixed;left:6vw;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:8px;transition:opacity .4s}
button{font:600 14px system-ui;color:#fff;background:rgba(10,16,28,.7);border:1px solid rgba(255,255,255,.22);border-left:3px solid #19b5ff;border-radius:8px;padding:11px 18px;cursor:pointer;text-align:left;letter-spacing:.08em;min-width:210px;transition:.15s}
button:hover{background:#19b5ff;border-left-color:#ff7a1a;transform:translateX(5px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;transition:opacity .3s}#hud .p{position:absolute;padding:10px 14px}
#hl{left:16px;top:16px;line-height:1.7;font-size:13px}#hl b{font-size:16px;color:#19b5ff;font-variant-numeric:tabular-nums}#hl small{color:#ff7a1a;letter-spacing:.2em;font-weight:700}
#sp{right:16px;bottom:16px;text-align:right}#spv{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
#mm{position:absolute;right:16px;top:16px;background:rgba(10,16,28,.6);border:1px solid rgba(255,255,255,.2);border-radius:12px}
#hint{left:16px;bottom:16px;font-size:11px;opacity:.7}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:84px;font-weight:900;letter-spacing:.1em;z-index:5;text-shadow:0 4px 30px #000;pointer-events:none;transition:opacity .3s}
#cap{position:fixed;left:0;right:0;bottom:12%;text-align:center;font-size:22px;letter-spacing:.35em;z-index:5;text-shadow:0 2px 14px #000;pointer-events:none}
#pn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;min-width:320px;max-width:min(560px,92vw);transition:opacity .25s}
#pn.b{top:auto;bottom:26px;transform:translateX(-50%)}
#pn h2{margin:0 0 10px;letter-spacing:.18em}#pn button{margin:4px 4px 0 0}
.bar{height:6px;background:#233;border-radius:3px;margin:3px 0 7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#19b5ff,#ff7a1a);border-radius:3px}
#tl{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;font-size:11px}#gr{font-size:44px;font-weight:800;color:#19b5ff;width:36px;text-align:center}#tl .bar{width:140px}
#thirds{position:fixed;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,#fff7 33.3%,transparent 33.5%,transparent 66.5%,#fff7 66.6%,transparent 66.8%),linear-gradient(0deg,transparent 33.2%,#fff7 33.3%,transparent 33.5%,transparent 66.5%,#fff7 66.6%,transparent 66.8%)}
td{padding:2px 14px 2px 0}kbd{background:#223;border:1px solid #456;border-radius:4px;padding:1px 6px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="load"><div id="lgl"></div><div class="tg">Loading Kigali…</div><div id="bar"><i></i></div></div>
<div id="menu" class="hide"><div id="lgm" style="margin-bottom:10px"></div>
<button data-a="race">START KCC RALLY</button>
<button data-a="free">FREE DRIVE</button>
<button data-a="veh">GARAGE &amp; STAGES</button>
<button data-a="photo">PHOTO MODE</button>
<button data-a="how">HOW TO PLAY</button>
<button data-a="set">SETTINGS</button>
<button data-a="cred">CREDITS</button></div>
<div id="hud" class="hide">
  <div class="p" id="hl"><small id="stn">KIGALI RUSH · KCC RALLY</small><br>TIME <b id="tm">00:00.00</b><br>
  <span id="rw">LAP <b id="lp">1 / 3</b> &nbsp; CHECKPOINT <b id="cp">0 / 8</b><br>BEST <b id="bs">--:--.--</b></span></div>
  <canvas id="mm" width="190" height="120"></canvas>
  <div class="p" id="sp"><span id="spv">0</span> KM/H<br><small id="cm"></small></div>
  <div class="p" id="hint">C camera · R reset · P pause · M mute · H HUD · 1–4 time of day</div>
  <div class="p" id="tl"><div id="gr">1</div><div>RPM <span id="rp"></span><div class="bar"><i id="rb"></i></div>THR<div class="bar"><i id="tb" style="background:#2bd04f"></i></div>BRK<div class="bar"><i id="bb" style="background:#e8423a"></i></div></div>
  <canvas id="gf" width="70" height="70"></canvas><div id="tx" style="min-width:110px;line-height:1.6"></div></div>
</div>
<div id="thirds" class="hide"></div>
<div id="msg" class="hide"></div>
<div id="cap"></div>
<div id="pn" class="p hide"></div>

<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Sky} from 'three/addons/objects/Sky.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ══════════════════════════════════════════════════════════════
   [00] CONSTANTS & HELPERS
   ══════════════════════════════════════════════════════════════ */
const $ = i => document.getElementById(i);
const PI = Math.PI;
const R = (a,b) => a + Math.random()*(b-a);
const cl = (v,a,b) => Math.max(a, Math.min(b, v));
const D = new T.Object3D();
const CC = new T.Color();

const LOGO = 'https://i.postimg.cc/SxKLB09w/Kigali-Rush-Game-logo.png';
const LG = `<img class="lg" src="${LOGO}" alt="KIGALI RUSH" onerror="this.outerHTML='<div class=tx>KIGALI <b>RUSH</b></div>'"><div class="tg">Race the Heart of Kigali.</div>`;
$('lgl').innerHTML = LG;
$('lgm').innerHTML = LG;

/* ══════════════════════════════════════════════════════════════
   [01] RENDERER / SCENE / CAMERA
   ══════════════════════════════════════════════════════════════ */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.FogExp2(0xbcd5e8, 0.0008);

const cam = new T.PerspectiveCamera(60, innerWidth/innerHeight, 0.4, 8000);
const orbit = new OrbitControls(cam, renderer.domElement);
orbit.enabled = false; orbit.enableDamping = true;
orbit.minDistance = 5; orbit.maxDistance = 500;

const MAT = o => new T.MeshStandardMaterial(o);
const add = (g,m,x=0,y=0,z=0,p=scene) => {
  const o = new T.Mesh(g,m); o.position.set(x,y,z);
  o.castShadow = true; o.receiveShadow = true; p.add(o); return o;
};
const mkTex = (w,h,fn,rx=1,ry=1,rep=true) => {
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  if(rep){ t.wrapS = t.wrapT = T.RepeatWrapping; }
  t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8;
  t.repeat.set(rx, ry);
  return t;
};
const EM = [];
const eAdd = (m,q) => { EM.push([m,q]); return m; };

/* ══════════════════════════════════════════════════════════════
   [02] TERRAIN HEIGHTFIELD
   ══════════════════════════════════════════════════════════════ */
const Y0 = 3;
const gh = r => r < 95 ? Y0 : r < 150 ? Y0*(150-r)/55 : 0;
const sm = (a,b,x) => { x = cl((x-a)/(b-a),0,1); return x*x*(3-2*x); };
const nz = (x,z) =>
  2.4*Math.sin(x*0.017+1.3)*Math.cos(z*0.014) +
  1.3*Math.sin(x*0.041+z*0.031) +
  0.6*Math.cos(x*0.072-z*0.049) +
  0.4*Math.sin(x*0.11+z*0.09);
const H = (x,z) => {
  const r = Math.hypot(x,z);
  const ridge = 16*sm(280,480,r)*(0.6+0.4*Math.sin(Math.atan2(z,x)*3.1));
  return gh(r) + nz(x,z)*sm(130,220,r)*(1-sm(300,440,r)) + ridge;
};

/* ══════════════════════════════════════════════════════════════
   [03] SKY, LIGHT & TIME-OF-DAY
   ══════════════════════════════════════════════════════════════ */
const sky = new Sky(); sky.scale.setScalar(6000); scene.add(sky);
const su = sky.material.uniforms;
su.mieDirectionalG.value = 0.82;

const sun = new T.DirectionalLight(0xfff5e6, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, {left:-120,right:120,top:120,bottom:-120,near:1,far:700});
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const hemi = new T.HemisphereLight(0x87ceeb, 0x3a6b35, 0.9);
scene.add(hemi);

const dir = (a,e) => { a*=PI/180; e*=PI/180; return [Math.sin(a)*Math.cos(e), Math.sin(e), Math.cos(a)*Math.cos(e)]; };
const MODES = {
  day:    {s:[100,180,80], sc:0xfff5e6, si:3.2, hs:0x87ceeb, hi:.9,  fog:0xbcd5e8, fd:.0008, ex:1.05, sk:[8,2.5,.005], lit:0},
  sunset: {s:dir(150,12),  sc:0xff8c42, si:2.5, hs:0xff9060, hi:.7,  fog:0xffa575, fd:.0018, ex:1.0,  sk:[10,3,.005], lit:.35},
  dusk:   {s:dir(232,5),   k:dir(216,-2.5), sc:0xff8a55, si:.55, hs:0x4a6aa8, hi:.75, fog:0x2f3f66, fd:.0015, ex:1.15, sk:[3,2.2,.012], lit:1},
  night:  {s:dir(250,-8),  k:dir(250,-8),   sc:0x5577bb, si:.30, hs:0x1e2c50, hi:.55, fog:0x080c16, fd:.0026, ex:.95,  sk:[1.6,.12,.006], lit:1.5}
};
const cur = {sc:new T.Color(), hs:new T.Color(), fog:new T.Color(),
             s:new T.Vector3(1,2,1), k:new T.Vector3(1,2,1),
             si:3, hi:.9, fd:.0008, ex:1, t:8, r:2.5, m:.005, lit:0};
let tgtM = MODES.day, lit = 0;
const sunV = new T.Vector3(1,2,1);
function setMode(k){ tgtM = MODES[k]; }
function todTick(dt){
  const m = tgtM, a = 1 - Math.exp(-dt*1.8);
  const v = new T.Vector3(), k = new T.Vector3();
  cur.sc.lerp(CC.setHex(m.sc), a);
  cur.hs.lerp(CC.setHex(m.hs), a);
  cur.fog.lerp(CC.setHex(m.fog), a);
  for(const q of ['si','hi','fd','ex','lit']) cur[q] += (m[q]-cur[q])*a;
  cur.t += (m.sk[0]-cur.t)*a;
  cur.r += (m.sk[1]-cur.r)*a;
  cur.m += (m.sk[2]-cur.m)*a;
  cur.s.lerp(v.set(...m.s).normalize(), a).normalize();
  cur.k.lerp(k.set(...(m.k||m.s)).normalize(), a).normalize();
  lit = cur.lit;
  sunV.copy(cur.s);
  sun.color.copy(cur.sc); sun.intensity = cur.si;
  hemi.color.copy(cur.hs);
  hemi.groundColor.setHex(lit > .5 ? 0x10161e : 0x3a6b35);
  hemi.intensity = cur.hi;
  scene.fog.color.copy(cur.fog); scene.fog.density = cur.fd;
  renderer.toneMappingExposure = cur.ex;
  su.turbidity.value = cur.t; su.rayleigh.value = cur.r; su.mieCoefficient.value = cur.m;
  su.sunPosition.value.copy(cur.k);
  EM.forEach(([x,q]) => x.emissiveIntensity = q*lit);
  domeLight.intensity  = lit*2200;
  domeLight2.intensity = lit*1400;
}

/* ══════════════════════════════════════════════════════════════
   [04] TERRAIN MESH
   ══════════════════════════════════════════════════════════════ */
const grass = r => mkTex(128,128,(g,w,h)=>{
  g.fillStyle = '#4a7d3c'; g.fillRect(0,0,w,h);
  for(let i=0;i<2000;i++){
    const v = R(0,1);
    g.fillStyle = `rgba(${(40+v*50)|0},${(90+v*70)|0},${(35+v*30)|0},.28)`;
    g.fillRect(R(0,w), R(0,h), 2, 2);
  }
}, r, r);

add(new T.CircleGeometry(700,72), MAT({map:grass(80), roughness:1})).rotation.x = -PI/2;
add(new T.CylinderGeometry(96,150,3,96), MAT({map:grass(12), roughness:1}), 0, 1.5, 0);
{
  const g = new T.PlaneGeometry(560,560,200,200); g.rotateX(-PI/2);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, Math.hypot(x,z) < 150 ? -6 : H(x,z));
  }
  g.computeVertexNormals();
  add(g, MAT({map:grass(140), roughness:1}));
}

/* plaza paving */
const pav = mkTex(256,256,(g,w,h)=>{
  g.fillStyle = '#b6b0a3'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=64) for(let y=0;y<h;y+=64){
    const s = 168+R(0,26)|0;
    g.fillStyle = `rgb(${s},${s-4},${s-14})`;
    g.fillRect(x+2,y+2,60,60);
    g.fillStyle = 'rgba(0,0,0,.06)';
    g.fillRect(x+2,y+60,60,4);
  }
}, 44, 44);
{
  const o = add(new T.RingGeometry(50,74,96), MAT({map:pav, roughness:.82}), 0, Y0+0.05, 0);
  o.rotation.x = -PI/2; o.castShadow = false;
}
{
  const o = add(new T.RingGeometry(80,92,96), MAT({color:0x2b2b2b, roughness:.95}), 0, Y0+0.06, 0);
  o.rotation.x = -PI/2; o.castShadow = false;
}

/* colliders (dome, hotel, IT Park footprints) */
const CIRC = [{x:0, z:0, r:52}];
[[-105,28,20],[-93,28,16]].forEach(([x,z,r]) => CIRC.push({x,z,r}));
for(let k=-2;k<=2;k++) CIRC.push({x:-105+k*12*.94, z:28+k*12*.343, r:13});
[[105,25,18],[100,-1,15],[135,1,10]].forEach(([x,z,r]) => CIRC.push({x,z,r}));

/* ══════════════════════════════════════════════════════════════
   [05] KCC DOME — 9-tier ETFE landmark
   ══════════════════════════════════════════════════════════════ */
const podM   = MAT({color:0x9a9a92, roughness:.78, metalness:.15});
const winM   = MAT({color:0x121e2a, metalness:.9, roughness:.08, emissive:0xffcf8a, emissiveIntensity:0});
const steel  = MAT({color:0xaab2b9, metalness:.9, roughness:.28});
const ledgeM = MAT({color:0xe8edf0, metalness:.55, roughness:.3});
eAdd(winM, 1.4);

add(new T.CylinderGeometry(50,50,5.5,96), podM, 0, Y0+2.75, 0);
add(new T.CylinderGeometry(50.8,50.8,1,96), MAT({map:pav, roughness:.82}), 0, Y0+6, 0);
{
  const gr = add(new T.CylinderGeometry(50.3,50.3,5.4,96,1,true),
    new T.MeshPhysicalMaterial({color:0x1a2a3a, metalness:.85, roughness:.06, transparent:true, opacity:.55, side:T.DoubleSide}),
    0, Y0+2.75, 0);
  gr.castShadow = false;
  const mull = new T.InstancedMesh(new T.BoxGeometry(0.22,5.4,0.22), steel, 64);
  for(let i=0;i<64;i++){
    const a = i/64*PI*2;
    D.position.set(Math.cos(a)*50.4, Y0+2.75, Math.sin(a)*50.4);
    D.rotation.set(0,-a,0); D.updateMatrix();
    mull.setMatrixAt(i, D.matrix);
  }
  scene.add(mull);
}

const dome = new T.Group(); dome.position.y = Y0+6.5; scene.add(dome);
const Rr = 28.5, NT = 9, y0 = 7, Ht = 32, tH = Ht/NT;
const E = y => Rr * Math.sqrt(Math.max(0, 1 - Math.pow((y-y0)/Ht/1.04, 1.5)));

const facet = mkTex(128,64,(g,w,h)=>{
  g.fillStyle = '#dbe4ea'; g.fillRect(0,0,w,h);
  const grd = g.createLinearGradient(0,0,w,h);
  grd.addColorStop(0,'#f6fafc'); grd.addColorStop(.55,'#c3ced6'); grd.addColorStop(1,'#9fadb8');
  g.fillStyle = grd;
  g.beginPath(); g.moveTo(0,h); g.lineTo(w/2,0); g.lineTo(w,h); g.fill();
  g.strokeStyle = '#5f6b75'; g.lineWidth = 3; g.stroke();
}, 48, 1);

const BAND = [0x2bd04f,0x2bd04f,0x2bd04f,0xffb81c,0xffb81c,0xffb81c,0x1e8cff,0x1e8cff,0x1e8cff];
const tierM = [];
for(let i=0;i<NT;i++){
  const yb = y0 + i*tH;
  const rb = E(yb), rt = E(yb+tH)+.6;
  const m = MAT({color:0xffffff, map:facet, roughness:.38, metalness:.12,
                 emissive:BAND[i], emissiveMap:facet, emissiveIntensity:0});
  eAdd(m, 1.15); tierM.push(m);
  const t = new T.Mesh(new T.CylinderGeometry(rt, rb, tH, 96, 1, true), m);
  t.position.y = yb + tH/2; t.castShadow = t.receiveShadow = true;
  dome.add(t);
  add(new T.CylinderGeometry(rb+1.1, rb+1.1, .4, 96), ledgeM, 0, yb, 0, dome);
  const rl = new T.Mesh(new T.TorusGeometry(rb+1.1, .05, 5, 96), steel);
  rl.rotation.x = PI/2; rl.position.y = yb + 1.1; dome.add(rl);
}
{
  const top = y0+Ht;
  add(new T.CylinderGeometry(E(top)+.6, E(top)+.6, .5, 48), steel, 0, top, 0, dome);
  add(new T.CylinderGeometry(.07,.4,9,8), steel, 0, top+4.5, 0, dome);
}
add(new T.CylinderGeometry(29.6,29.6,y0,96), winM, 0, y0/2, 0, dome);

const domeLight  = new T.PointLight(0x2bd04f, 0, 160, 2); domeLight.position.y = 26; dome.add(domeLight);
const domeLight2 = new T.PointLight(0x1e8cff, 0, 160, 2); domeLight2.position.y = 12; dome.add(domeLight2);

/* ══════════════════════════════════════════════════════════════
   [06] RADISSON BLU HOTEL
   ══════════════════════════════════════════════════════════════ */
const hotel = new T.Group();
hotel.position.set(-105, gh(108.8), 28);
hotel.rotation.y = -0.35;
scene.add(hotel);

const hotelWall = MAT({color:0xd9d2c5, roughness:.82, metalness:.05});
const hotelGlass = MAT({color:0x1b2c3a, metalness:.9, roughness:.09, emissive:0xffcf8a, emissiveIntensity:0});
eAdd(hotelGlass, 1.3);

add(new RoundedBoxGeometry(62,23,24,4,7), hotelWall, 0, 11.5, 0, hotel);
add(new RoundedBoxGeometry(60.6,21.4,24.4,3,6), hotelGlass, 0, 11.6, 0, hotel);
{
  const bands = new T.InstancedMesh(new T.BoxGeometry(60.8,.9,24.6),
    MAT({color:0x0d1620, metalness:.7, roughness:.2, emissive:0xffd9a0, emissiveIntensity:0}), 14);
  for(let i=0;i<14;i++){
    D.position.set(0, 3+i*1.45, 0); D.updateMatrix(); bands.setMatrixAt(i, D.matrix);
  }
  hotel.add(bands); eAdd(bands.material, 0.9);
}
add(new RoundedBoxGeometry(64,1.1,26,2,.3), ledgeM, 0, 23.4, 0, hotel);
add(new RoundedBoxGeometry(63,0.9,25.4,2,.3), MAT({color:0xbfb8ab, roughness:.85}), 0, 0.9, 0, hotel);
add(new T.BoxGeometry(14,.5,7), MAT({color:0xe9edf0, metalness:.5, roughness:.35}), 0, 5.2, 12.6, hotel);
[-6,6].forEach(x => add(new T.BoxGeometry(.35,5.2,.35), steel, x, 2.6, 12.6, hotel));
add(new T.BoxGeometry(9,2.6,6), MAT({color:0x8f8a80, roughness:.85}), -14, 24.8, 0, hotel);
add(new T.BoxGeometry(6,2.1,5), MAT({color:0x8f8a80, roughness:.85}), 13, 24.6, 2, hotel);

/* Agaseké ribbon fins */
{
  const pal = [0x00A1DE,0xFAD201,0x20603D,0xE8A87C,0xC38D9E,0x8B5E3C,0xD4A76A]
    .map(c => MAT({color:c, metalness:.55, roughness:.28}));
  let rc = 0;
  for(const s of [1,-1]){
    for(let i=0;i<22;i++)

function tower(x,z,w,h,d){

function facadeTex(baseCol, litCol, cols, rows, litChance){
  return mkTex(128,128,(g,w,h)=>{
    g.fillStyle = baseCol; g.fillRect(0,0,w,h);
    const cw = w/cols, ch = h/rows;
    for(let y=0;y<rows;y++)
      for(let x=0;x<cols;x++){
        const on = Math.random() < litChance;
        g.fillStyle = on ? litCol : 'rgba(40,60,80,.55)';
        g.fillRect(x*cw + cw*.15, y*ch + ch*.15, cw*.7, ch*.7);
        if(on){
          g.fillStyle = 'rgba(0,0,0,.15)';
          g.fillRect(x*cw + cw*.15, y*ch + ch*.15, cw*.7, ch*.12);
        }
      }
  });
}

function nbBuilding(x, z, w, h, d, style){
  const y = H(x,z);
  const g = new T.Group(); g.position.set(x, y, z); scene.add(g);
  g.rotation.y = R(-0.4, 0.4);
  let bodyCol, winMat, roofCol;
  switch(style){
    case 'glass': bodyCol = NB_MATS.glassA; winMat = NB_WIN.blue; roofCol = NB_MATS.roof; break;
    case 'glass2':bodyCol = NB_MATS.glassB; winMat = NB_WIN.cool; roofCol = NB_MATS.roof; break;
    case 'cream': bodyCol = NB_MATS.cream;  winMat = NB_WIN.warm; roofCol = NB_MATS.roofRed; break;
    case 'terra': bodyCol = NB_MATS.terra;  winMat = NB_WIN.warm; roofCol = NB_MATS.roofRed; break;
    case 'sand':  bodyCol = NB_MATS.sand;   winMat = NB_WIN.warm; roofCol = NB_MATS.roof; break;
    default:      bodyCol = NB_MATS.white;  winMat = NB_WIN.warm; roofCol = NB_MATS.roof;
  }
  add(new RoundedBoxGeometry(w, h, d, 3, .35), bodyCol, 0, h/2, 0, g);
  const wm = add(new T.BoxGeometry(w+.1, h-1.4, d+.1), winMat, 0, h/2, 0, g);
  wm.castShadow = false;
  add(new T.BoxGeometry(w+1, .5, d+1), bodyCol, 0, h+.2, 0, g);
  add(new T.BoxGeometry(w*.9, .6, d*.9), roofCol, 0, h+.7, 0, g);
  if(h > 18)
    add(new T.BoxGeometry(w*.35, 2.4, d*.35), MAT({color:0x8f8a80, roughness:.9}), R(-w*.2,w*.2), h+2.2, R(-d*.2,d*.2), g);
  if(Math.random() < .6){
    add(new T.BoxGeometry(w*.4, .25, d*.25), MAT({color:0x222, metalness:.4}), 0, 3.5, d/2+.5, g);
    for(const sx of [-1,1])
      add(new T.CylinderGeometry(.1,.1,3.5,6), steel, sx*w*.18, 1.75, d/2+.6, g);
  }
  if(style === 'cream' || style === 'sand')
    for(let f=1; f<Math.floor(h/3.2); f++)
      add(new T.BoxGeometry(w+.6, .12, d+.6), bodyCol, 0, f*3.2, 0, g);
  return g;
}

  for(let i=0; i<6; i++){
    const a = i/6 * PI*2 + .3;
    const bx = Math.cos(a)*(r-3.5), bz = Math.sin(a)*(r-3.5);

    add(new T.BoxGeometry(1.8, .5, .1), MAT({color:0x6b5540, roughness:.85}), bx, .7, bz, g).rotation.y = -a;
  }

    add(new T.SphereGeometry(2.2, 10, 8), MAT({color:0x3f7a2e, roughness:1}), tx, 5.2, tz, g);

  }
  return g;
}

const WP = [
  [0, 112],
  [58, 102],
  [105, 78],
  [140, 42],
  [158, -8],
  [148, -62],
  [112, -108],
  [48, -138],

  [-22, 124]
].map(([x,z]) => new T.Vector3(x, 0, z));

const curve = new T.CatmullRomCurve3(WP, true, 'centripetal');
const N = 720;
const LEN = curve.getLength();
const P = curve.getSpacedPoints(N).slice(0, N);
const TG = P.map((p,i) => {
  const a = P[(i+1)%N], b = P[(i-1+N)%N];
  return new T.Vector3(a.x-b.x, 0, a.z-b.z).normalize();
});
const NR = TG.map(t => new T.Vector3(t.z, 0, -t.x));
const hd = i => Math.atan2(TG[i].x, TG[i].z);

const ribbon = (o0,o1,dy,vs,mat,uvRep=1) => {
  const pos=[], uv=[], ix=[];
  for(let i=0;i<=N;i++){
    const k = i%N, p = P[k], n = NR[k];
    for(const o of [o0,o1]){
      const x = p.x+n.x*o, z = p.z+n.z*o;
      pos.push(x, H(x,z)+dy, z);
    }
    const v = i*LEN/N/vs*uvRep;
    uv.push(0, v, 1, v);
    if(i<N){
      const a = i*2;
      ix.push(a,a+2,a+1, a+1,a+2,a+3);
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv,2));
  g.setIndex(ix); g.computeVertexNormals();
  const m = new T.Mesh(g,mat);
  m.receiveShadow = true; m.castShadow = false;
  scene.add(m);
  return m;
};

const CAMN = ['CHASE','WIDE','HOOD','COCKPIT','CINEMATIC'];
let stg = 0, LAPS = 3, drI = 0, gear = 1, rpmF = .3, lapT = 0, bestLap = 0;
let gx = 0, gy = 0, thS = 0, brS = 0;
let S = 'load', pv = '', mode = 'race', carI = 0, camI = 0, ni = 0, u = 0, cpn = 0;

loadBest();
const fmt = t => (t/60|0).toString().padStart(2,'0')+':'+(t%60).toFixed(2).padStart(5,'0');

function near(x,z,full){
  let b = 1e9, bi = ni;
  const g = full ? N/2 : 25;
  for(let k=-g;k<=g;k++){
    const i = ((ni+k)%N+N)%N;
    const dx = x-P[i].x, dz = z-P[i].z, d = dx*dx+dz*dz;
    if(d < b){ b = d; bi = i; }
  }
  ni = bi; return bi;
}
function place(i,off){
  ps.x = P[i].x + NR[i].x*off;
  ps.z = P[i].z + NR[i].z*off;
  ps.th = hd(i);
  ps.vx = ps.vz = ps.sv = ps.f = ps.l = 0;
  ps.y = H(ps.x,ps.z);
  ni = i; ca = ps.th;
}

function hit(v){
  if(v > 3 && tm-hitT > .3){
    hitT = tm; shk = cl(v/14,.2,1);
    beep(90,.25,'sawtooth',.35);
  }
}
function step(h){
  const C = CARS[carI];
  const ctl = S==='race' || S==='free';
  const th = ctl && (K.KeyW||K.ArrowUp) ? 1 : 0;
  const br = ctl && (K.KeyS||K.ArrowDown) ? 1 : 0;
  const lt = ctl ? ((K.KeyA||K.ArrowLeft)?1:0) - ((K.KeyD||K.ArrowRight)?1:0) : 0;
  const hb = ctl && K.Space;
  const sn = Math.sin(ps.th), cs = Math.cos(ps.th);
  let f = ps.vx*sn + ps.vz*cs;
  let l = ps.vx*cs - ps.vz*sn;
  if(th) f += C.ac*(1 - Math.max(0,f)/C.vm)*h*(f<0?2:1);
  if(br){ if(f > .5) f -= 28*h; else f = Math.max(f - C.ac*.6*h, -14); }
  if(S==='finish' || S==='count') f -= Math.sign(f)*Math.min(Math.abs(f), 22*h);
  f -= f*.1*h + Math.sign(f)*1.4*h;
  if(!th && !br && Math.abs(f) < .3) f = 0;
  if(hb) f *= 1 - .55*h;
  l *= Math.exp(-C.gr*(ps.off?.55:ps.kb?.85:1)*(hb?.2:1)*(Math.abs(l)>6?.7:1)*h);
  if(ps.off) f -= f*.7*h;
  ps.sv += (lt - ps.sv)*Math.min(1, h*9);
  const yaw = ps.sv*C.hd*cl(f/7,-1,1)/(1 + Math.abs(f)*.035)*(hb?1.5:1);
  ps.sl = (H(ps.x+sn*2, ps.z+cs*2) - H(ps.x-sn*2, ps.z-cs*2))/4;
  f -= 5.9*ps.sl*h;
  ps.yw = yaw;
  ps.vx = sn*f + cs*l;
  ps.vz = cs*f - sn*l;
  ps.th += yaw*h;
  ps.x += ps.vx*h;
  ps.z += ps.vz*h;
  ps.pf = ps.f; ps.f = f; ps.l = l;

  for(const c of CIRC){
    const dx = ps.x-c.x, dz = ps.z-c.z, d = Math.hypot(dx,dz), m = c.r+2;
    if(d < m){
      const nx = dx/d, nz = dz/d, vn = ps.vx*nx + ps.vz*nz;
      ps.x = c.x + nx*m; ps.z = c.z + nz*m;
      if(vn < 0){
        ps.vx = (ps.vx - 1.35*vn*nx)*.8;
        ps.vz = (ps.vz - 1.35*vn*nz)*.8;
        hit(-vn);
      }
    }
  }

  if(mode === 'race'){
    const i = near(ps.x, ps.z), n = NR[i];
    const dl = (ps.x-P[i].x)*n.x + (ps.z-P[i].z)*n.z;
    const a = Math.abs(dl);
    ps.off = a > 7.4;
    ps.kb = a > 6;
    if(a > 11.6){
      const s = Math.sign(dl), o = a - 11.6;
      ps.x -= n.x*s*o; ps.z -= n.z*s*o;
      const vn = (ps.vx*n.x + ps.vz*n.z)*s;
      if(vn > 0){
        ps.vx = (ps.vx - 1.35*vn*n.x*s)*.85;
        ps.vz = (ps.vz - 1.35*vn*n.z*s)*.85;
        hit(vn);
      }
    }
  }
}

let AC, mg, eo1, eo2, eo3, wg, eg, sg, cg, vol = .7, muted = false;
function audioInit(){
  if(AC) return;
  try{
    AC = new AudioContext();
    mg = AC.createGain(); mg.gain.value = vol; mg.connect(AC.destination);
    eo1 = AC.createOscillator(); eo1.type = 'sawtooth';
    eo2 = AC.createOscillator(); eo2.type = 'square';
    eo3 = AC.createOscillator(); eo3.type = 'sine';
    const ef = AC.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 820;
    eg = AC.createGain(); eg.gain.value = 0;
    eo1.connect(ef); eo2.connect(ef); eo3.connect(ef);
    ef.connect(eg); eg.connect(mg);
    eo1.start(); eo2.start(); eo3.start();
    const nb = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const d = nb.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const ns = (f,t,g)=>{
      const s = AC.createBufferSource(); s.buffer = nb; s.loop = true;
      const fl = AC.createBiquadFilter(); fl.type = t; fl.frequency.value = f;
      const gn = AC.createGain(); gn.gain.value = g;
      s.connect(fl); fl.connect(gn); gn.connect(mg); s.start(); return gn;
    };
    sg = ns(2400,'bandpass',0);
    wg = ns(1100,'bandpass',0);
    cg = ns(650,'bandpass',.05);
    ns(120,'lowpass',.05);
  }catch(e){ AC = null; }
}
const beep = (f,d=.15,t='sine',v=.25)=>{
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = t; o.frequency.value = f;
  g.gain.setValueAtTime(v, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+d);
  o.connect(g); g.connect(mg);
  o.start(); o.stop(AC.currentTime+d);
};
const setVol = () => { if(mg) mg.gain.value = muted ? 0 : vol; };

const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const tgt = new T.Vector3(), des = new T.Vector3();
function camPlay(dt){
  if(drvGroup) drvGroup.visible = camI !== 3;
  const sp = Math.abs(ps.f);
  const k = 1 - Math.exp(-dt*6);
  ca += wrap(ps.th - ca)*(1 - Math.exp(-dt*4));
  const fx = Math.sin(ca), fz = Math.cos(ca);
  const px = ps.x, pz = ps.z, py = ps.y;
  let tf = 60;
  if(camI === 0 || camI === 1){
    const d = camI ? 15 : 8 + sp*.05;
    const hgt = camI ? 6.5 : 3.2;
    des.set(px - fx*d, py + hgt, pz - fz*d);
    cam.position.lerp(des, k);
    tgt.set(px + fx*8, py + 1.3, pz + fz*8);
    tf = (camI ? 68 : 62) + cl(sp, 0, 50)*.45;
  } else if(camI === 2){
    const a = Math.sin(ps.th), b = Math.cos(ps.th);
    cam.position.set(px + a*.4, py + 1.2, pz + b*.4);
    tgt.set(px + a*30, py + 1.1, pz + b*30);
    tf = 70 + sp*.3;
  } else if(camI === 3){
    const a = Math.sin(ps.th), b = Math.cos(ps.th), c = CARS[carI];
    const ey = py + .3 + c.h + c.cb[1];
    const o = .38 + ps.sv*6;
    cam.position.set(px + a*.1 + b*.38, ey, pz + b*.1 - a*.38);
    tgt.set(px + a*30 + b*o, ey - .1, pz + b*30 - a*o);
    tf = 75 + sp*.3;
  } else {
    des.set(px + Math.cos(ps.th)*22 + fx*18, py + 5, pz - Math.sin(ps.th)*22 + fz*18);
    cam.position.lerp(des, 1 - Math.exp(-dt*1.2));
    tgt.set(px, py + 1, pz);
    tf = 50;
  }
  if(sp > 34){
    cam.position.x += R(-.04,.04);
    cam.position.y += R(-.04,.04);
  }
  if(shk > 0){
    cam.position.x += R(-1,1)*shk*.4;
    cam.position.y += R(-1,1)*shk*.3;
    shk = Math.max(0, shk - dt*2.5);
  }
  fov += (tf - fov)*.1;
  cam.fov = fov;
  cam.updateProjectionMatrix();
  cam.lookAt(tgt);
}
function camIntro(){
  const sh = it/3|0;
  const cp = ['KIGALI CONVENTION CENTRE','THE ROAD','YOUR MACHINE','START GRID'];
  if(sh === 0){
    const a = .6 + it*.16;
    cam.position.set(Math.cos(a)*175, 75, Math.sin(a)*175);
    tgt.set(0, 22, 0);
  } else if(sh === 1){
    const t = it - 3;
    cam.position.set(P[0].x + NR[0].x*16, 4 + t*.5, P[0].z + NR[0].z*16 + t*3);
    tgt.set(ps.x, 3, ps.z);
  } else {
    const a = it*.5, sn = Math.sin(ps.th), cs = Math.cos(ps.th);
    if(it < 6) cam.position.set(ps.x + Math.cos(a)*6, 1.6, ps.z + Math.sin(a)*6);
    else cam.position.set(ps.x - sn*11, 4, ps.z - cs*11);
    tgt.set(ps.x, 1, ps.z);
  }
  cam.fov = 55; cam.updateProjectionMatrix();
  cam.lookAt(tgt);
  $('cap').textContent = it < 9 ? cp[Math.min(3, it/2.25|0)] : '';
}

function telem(){
  const up = K.KeyW || K.ArrowUp, dn = K.KeyS || K.ArrowDown;
  thS += ((up?1:0) - thS)*.25;
  brS += ((dn?1:0) - brS)*.25;

  $('rp').textContent = Math.round(rpmF*80)*100;
  const rb = $('rb');
  rb.style.width = rpmF*100 + '%';
  rb.style.background = rpmF > .92 ? '#ff2a2a' : '#19b5ff';
  $('tb').style.width = thS*100 + '%';
  $('bb').style.width = brS*100 + '%';
  gx += (cl(ps.yw*ps.f/9.8, -2, 2) - gx)*.1;
  gy += (cl((ps.f - ps.pf)/STEP/9.8, -2, 2) - gy)*.1;
  const g = $('gf').getContext('2d');
  g.clearRect(0,0,70,70);
  g.strokeStyle = '#fff6'; g.beginPath();
  g.arc(35,35,30,0,6.3);
  g.moveTo(5,35); g.lineTo(65,35);
  g.moveTo(35,5); g.lineTo(35,65);
  g.stroke();
  g.fillStyle = '#ff7a1a';
  g.beginPath(); g.arc(35+gx*15, 35-gy*15, 4, 0, 6.3); g.fill();
  if(mode === 'race'){
    const p = (((u%N)+N)%N)/N;
    const d = bestLap ? lapT - bestLap*p : 0;
    const m = Math.max(0, Math.round(((cpn+1)*N/8 - u)*LEN/N));
    $('tx').innerHTML = `LAP Δ <b>${bestLap ? (d>0?'+':'')+d.toFixed(2)+' s' : '--'}</b><br>NEXT CP <b>${m} m</b>` +
      (ps.off ? '<br><b style="color:#ff4a4a;letter-spacing:.15em">OFF TRACK</b>' : '');
  } else $('tx').textContent = '';
}

   [21] MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
buildCar(CARS[0]);
setMode('day');

const STEP = 1/120;
let acc = 0;
const ledTmp = new T.Color();
const LED_BL = new T.Color(0x1e8cff), LED_YE = new T.Color(0xffb81c), LED_GR = new T.Color(0x2bd04f);
const LED_CY = [LED_GR, LED_YE, LED_BL];

function ledUpdate(now){
  const T = now/1000 % 6;
  tierM.forEach((m,i) => {
    if(T < 4.5) ledTmp.copy([LED_BL, LED_YE, LED_GR][T/1.5|0]);
    else {
      const w = (((i/9*3 - (T-4.5)*2)%3)+3)%3;
      const f = w|0;
      ledTmp.copy(LED_CY[f]).lerp(LED_CY[(f+1)%3], w-f);
    }
    m.emissive.copy(ledTmp);
    m.emissiveIntensity = lit*(1 + .07*Math.sin(now/600 + i));
  });
  domeLight.color.copy(tierM[4].emissive);
}

function frame(){
  requestAnimationFrame(frame);
  const now = performance.now()/1000;
  const dt = Math.min(.05, now - last);
  last = now;
  tm += dt;

  todTick(dt);
  ledUpdate(tm*1000);

  if(S === 'intro'){
    it += dt;
    camIntro();
    if(it >= 9){ S = 'count'; cdT = 0; cdN = 4; $('cap').textContent = ''; }
  }
  if(S === 'count'){
    cdT += dt;
    const n = 3 - Math.floor(cdT);
    if(n !== cdN){
      cdN = n;
      if(n > 0){ msg(''+n, 950); beep(440,.2); }
      else { msg('GO!', 900); beep(880,.5,'square'); S = 'race'; raceT = 0; }
    }
  }

  if(['count','race','free','finish'].includes(S)){
    acc += dt;
    while(acc >= STEP){ step(STEP); acc -= STEP; }

    if(S === 'race'){
      raceT += dt; lapT += dt;
      const i = near(ps.x, ps.z);
      let d = i - (((u%N)+N)%N);
      if(d > N/2) d -= N;
      if(d < -N/2) d += N;
      u += d;
      if(u >= (cpn+1)*N/8){
        cpn++;
        if(cpn % 8 === 0){
          if(!bestLap || lapT < bestLap){
            bestLap = lapT;
            try { localStorage.setItem('kr_bl_'+stg, bestLap); } catch(e){}
          }
          lapT = 0;
        }
        if(cpn >= LAPS*8){
          S = 'finish'; finT = 0;
          newRec = !best || raceT < best;
          if(newRec){ best = raceT; try { localStorage.setItem(bk(), best); } catch(e){} }
          msg('FINISH!', 2500);
          beep(660,.6,'triangle');
          if(newRec) setTimeout(()=>beep(990,.7,'triangle'), 500);
        } else {
          msg(cpn%8 ? `CHECKPOINT ${cpn%8} / 8` : `LAP ${cpn/8+1} / ${LAPS}`, 900);
          beep(740,.15,'triangle');
        }
      }
    }
    if(S === 'finish'){
      finT += dt;
      if(finT > 3) results();
    }

    const gv = Math.abs(ps.f)/CARS[carI].vm*6;
    gear = cl(Math.ceil(gv), 1, 6);
    rpmF = .3 + .7*cl(gv - (gear-1), 0, 1);

    ps.y += (H(ps.x, ps.z) - ps.y)*.4;
    car.position.set(ps.x, ps.y + .12, ps.z);
    ps.pt += (cl((ps.f - ps.pf)*-.35, -.05, .05) - ps.pt)*.1;
    ps.rl += (cl(ps.l*.012, -.08, .08) - ps.rl)*.1;
    car.rotation.set(ps.pt - Math.atan(ps.sl||0), ps.th, ps.rl, 'YXZ');

    if(drvGroup){
      drvGroup.rotation.z = -ps.sv*.15;
      drvGroup.rotation.y = ps.sv*.25;
    }
    if(steeringWheel) steeringWheel.rotation.z = -ps.sv*1.5;

    const steerAngle = ps.sv*.42;
    wheels.forEach(w => {
      if(w.front) w.group.rotation.y = steerAngle;
      w.spin.rotation.x += ps.f*dt/.37;
    });

    const braking = K.KeyS || K.ArrowDown || K.Space;
    const tailI = braking ? 3.2 : 0.35 + lit*1.2;
    tailLights.forEach(m => m.emissiveIntensity = tailI);
    brakelights.forEach(m => m.emissiveIntensity = braking ? 2.4 : lit*.6);
    headLights.forEach(m => m.emissiveIntensity = 1.2 + lit*1.6);
    const beamI = lit > .3 ? 900 : 0;
    headBeamL.intensity = beamI;
    headBeamR.intensity = beamI;

    if(S !== 'intro') camPlay(dt);

    if(AC){
      const racing = (S === 'race' || S === 'free');
      eg.gain.value = racing ? .05 + .09*((K.KeyW||K.ArrowUp) ? 1 : .3) : 0;
      eo1.frequency.value = 45 + rpmF*190;
      eo2.frequency.value = eo1.frequency.value*.5;
      eo3.frequency.value = eo1.frequency.value*.25;
      wg.gain.value = cl(Math.abs(ps.f)/45, 0, 1)*.12;
      sg.gain.value = cl((Math.abs(ps.l)-3)/10, 0, .5)*(Math.abs(ps.f) > 5 ? 1 : 0);
      if(cg) cg.gain.value = .035 + .02*Math.sin(tm*.7);
    }
  }
  else if(S === 'menu' || S === 'load' || S === 'select'){
    car.position.set(ps.x, ps.y, ps.z);
    car.rotation.set(0, ps.th, 0);
    headBeamL.intensity = lit > .3 ? 900 : 0;
    headBeamR.intensity = lit > .3 ? 900 : 0;
    if(S === 'select'){
      const a = tm*.5;
      cam.position.set(ps.x + Math.cos(a)*7, ps.y + 2.2, ps.z + Math.sin(a)*7);
      tgt.set(ps.x, ps.y + .8, ps.z);
    } else {
      const a = tm*.07 + .5;
      cam.position.set(Math.cos(a)*165, 48, Math.sin(a)*165);
      tgt.set(0, 24, 0);
    }
    cam.fov = 55; cam.updateProjectionMatrix(); cam.lookAt(tgt);
    if(AC) eg.gain.value = 0;
  }
  else if(S === 'photo'){
    orbit.update();
    headBeamL.intensity = lit > .3 ? 900 : 0;
    headBeamR.intensity = lit > .3 ? 900 : 0;
  }
  if(S === 'intro'){
    car.position.set(ps.x, ps.y, ps.z);
    car.rotation.set(0, ps.th, 0);
  }

  const cx = ['photo','menu','select','load'].includes(S) ? 0 : ps.x;
  const cz = ['photo','menu','select','load'].includes(S) ? 0 : ps.z;
  sun.target.position.set(cx, 0, cz);
  sun.position.copy(sunV).multiplyScalar(260).add(sun.target.position);

  for(let n=0;n<NP;n++){
    const p = ppl[n];
    const bob = Math.abs(Math.sin(tm*3 + p.ph))*(.12 + .10*Math.sin(p.ph));
    const y = H(p.x, p.z);
    D.rotation.set(0, p.ry, 0); D.scale.set(1,1,1);
    D.position.set(p.x, y + .65 + bob, p.z); D.updateMatrix();
    bodies.setMatrixAt(n, D.matrix);
    D.position.set(p.x, y + 1.42 + bob, p.z); D.updateMatrix();
    heads.setMatrixAt(n, D.matrix);
    D.position.set(p.x, y + 1.62 + bob, p.z); D.updateMatrix();
    hair.setMatrixAt(n, D.matrix);
    const wave = Math.sin(tm*4 + p.ph)*.35;
    for(let s=0;s<2;s++){
      const side = s ? 1 : -1;
      D.position.set(
        p.x + Math.cos(p.ry)*side*.26,
        y + 1.02 + bob + wave*.15,
        p.z + Math.sin(p.ry)*side*.26
      );
      D.rotation.set(-.6 + wave, p.ry, 0);
      D.updateMatrix();
      arms.setMatrixAt(n*2 + s, D.matrix);
    }
  }
  bodies.instanceMatrix.needsUpdate = true;
  heads.instanceMatrix.needsUpdate = true;
  hair.instanceMatrix.needsUpdate = true;
  arms.instanceMatrix.needsUpdate = true;
  if(bodies.instanceColor) bodies.instanceColor.needsUpdate = true;
  if(arms.instanceColor) arms.instanceColor.needsUpdate = true;

  flashes.forEach((f,i) => {
    f.t -= dt;
    if(f.t < 0){
      f.t = R(1.5, 5);
      const p = ppl[(i*7) % NP];
      const y = H(p.x, p.z);
      f.s.position.set(p.x, y + 1.4, p.z);
      f.s.material.opacity = 1;
    } else {
      f.s.material.opacity = Math.max(0, f.s.material.opacity - dt*4);
    }
  });

  if(['race','free','finish','count','pause'].includes(S)){
    $('spv').textContent = Math.round(Math.abs(ps.f)*3.6*1.25);
    $('cm').textContent = CAMN[camI] + ' CAM';
    if(mode === 'race'){
      $('tm').textContent = fmt(raceT);
      $('lp').textContent = `${Math.min(LAPS, Math.floor(cpn/8)+1)} / ${LAPS}`;
      $('cp').textContent = `${cpn%8} / 8`;
      $('bs').textContent = best ? fmt(best) : '--:--.--';
    }
    const g = mmx;
    g.clearRect(0,0,190,120);
    g.drawImage(mmc, 0, 0);
    const nk = cpn%8 + 1, ni2 = nk*N/8 % N | 0;
    if(mode === 'race'){
      g.fillStyle = '#ff7a1a';
      g.beginPath(); g.arc(mx(P[ni2].x), mz(P[ni2].z), 4, 0, 6.3); g.fill();
    }
    g.fillStyle = '#19b5ff';
    g.beginPath(); g.arc(mx(ps.x), mz(ps.z), 4.5, 0, 6.3); g.fill();
    telem();
  }

  if(mode === 'race' && gates[1]){
    const nk = cpn%8 + 1;
    const p = .6 + .6*Math.sin(tm*6);
    gates.forEach((m,k) => {
      if(m){
        m.emissive.setHex(k === nk ? 0xff7a1a : 0x19b5ff);
        m.emissiveIntensity = k === nk ? 1 + p : .5;
      }
    });
  }

  renderer.render(scene, cam);
}

place(0,0);
requestAnimationFrame(frame);

setTimeout(() => {
  $('load').classList.add('hide');
  $('menu').classList.remove('hide');
  S = 'menu';
}, 1600);
</script>
</body>
</html>
